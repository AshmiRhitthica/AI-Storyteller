<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Tales — Paste Story</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400&display=swap"
    rel="stylesheet"
>

<style>

:root{
    --ink:#f2f1ff;
    --soft:rgba(226,228,255,.78);
    --edge:rgba(178,196,255,.28);
    --glow:rgba(140,170,255,.45);
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    background:#070a1c;
    color:var(--ink);
    font-family:"Inter",sans-serif;
}


/* ============================================================
   PAGE
============================================================ */

.page{
    min-height:100vh;

    position:relative;

    background:
        linear-gradient(
            rgba(7,10,28,.55),
            rgba(7,10,28,.72)
        ),
        url("ai-tales-bg.png");

    background-size:cover;
    background-position:center bottom;
    background-attachment:fixed;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:40px 20px;
}


/* ============================================================
   OVERLAY
============================================================ */

.overlay{
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(120,150,255,.12),
            transparent 45%
        );

    pointer-events:none;
}


/* ============================================================
   CONTAINER
============================================================ */

.container{
    width:min(900px,94vw);

    position:relative;
    z-index:1;

    display:flex;
    flex-direction:column;
    align-items:center;
}


/* ============================================================
   BACK BUTTON
============================================================ */

.back{
    align-self:flex-start;

    margin-bottom:25px;

    color:var(--soft);

    text-decoration:none;

    font-size:14px;
    font-weight:300;

    transition:
        color .3s ease,
        transform .3s ease;
}

.back:hover{
    color:white;

    transform:translateX(-4px);
}


/* ============================================================
   TITLE
============================================================ */

.title{
    margin:0;

    font-family:"Cormorant Garamond",serif;

    font-size:clamp(42px,6vw,72px);

    font-weight:500;

    text-shadow:
        0 0 25px rgba(150,180,255,.35);
}


/* ============================================================
   SUBTITLE
============================================================ */

.subtitle{
    margin:8px 0 35px;

    color:var(--soft);

    font-size:15px;

    font-weight:300;

    text-align:center;
}


/* ============================================================
   STORY CARD
============================================================ */

.story-card{
    width:100%;

    padding:30px;

    border:1px solid var(--edge);

    border-radius:24px;

    background:
        radial-gradient(
            120% 90% at 15% 0%,
            rgba(126,166,255,.16),
            transparent 60%
        ),
        linear-gradient(
            145deg,
            rgba(40,58,130,.28),
            rgba(30,35,90,.18)
        );

    backdrop-filter:blur(16px) saturate(120%);
    -webkit-backdrop-filter:blur(16px) saturate(120%);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        0 20px 60px rgba(0,0,0,.35);
}


/* ============================================================
   LABEL
============================================================ */

.label{
    display:block;

    margin-bottom:12px;

    font-family:"Cormorant Garamond",serif;

    font-size:24px;
}


/* ============================================================
   TEXTAREA
============================================================ */

textarea{
    width:100%;

    min-height:330px;

    resize:vertical;

    padding:20px;

    border:1px solid rgba(190,205,255,.25);

    border-radius:16px;

    outline:none;

    background:rgba(5,9,30,.38);

    color:#f4f5ff;

    font-family:"Inter",sans-serif;

    font-size:15px;

    font-weight:300;

    line-height:1.7;

    transition:
        border-color .3s ease,
        box-shadow .3s ease,
        background .3s ease;
}

textarea::placeholder{
    color:rgba(220,225,255,.48);
}

textarea:focus{
    border-color:rgba(200,220,255,.55);

    background:rgba(5,9,30,.48);

    box-shadow:
        0 0 25px rgba(120,160,255,.12);
}


/* ============================================================
   ACTIONS
============================================================ */

.actions{
    display:flex;

    justify-content:flex-end;

    gap:12px;

    margin-top:20px;
}

button{
    border:none;

    cursor:pointer;

    font-family:"Inter",sans-serif;
}


/* ============================================================
   CLEAR BUTTON
============================================================ */

.clear-btn{
    padding:12px 20px;

    border-radius:12px;

    background:rgba(255,255,255,.06);

    border:1px solid rgba(190,205,255,.2);

    color:var(--soft);

    transition:.3s ease;
}

.clear-btn:hover{
    background:rgba(255,255,255,.1);

    color:white;
}


/* ============================================================
   CONTINUE BUTTON
============================================================ */

.continue-btn{
    display:flex;

    align-items:center;

    gap:10px;

    padding:12px 22px;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            rgba(120,150,255,.45),
            rgba(120,80,190,.45)
        );

    border:1px solid rgba(210,220,255,.35);

    color:white;

    box-shadow:
        0 5px 20px rgba(80,100,220,.18);

    transition:
        transform .3s ease,
        box-shadow .3s ease,
        background .3s ease;
}

.continue-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 8px 28px rgba(100,120,255,.3);
}

.continue-btn:disabled{
    cursor:not-allowed;

    opacity:.65;

    transform:none;

    box-shadow:none;
}

.continue-btn svg{
    width:17px;

    height:17px;

    stroke:white;

    fill:none;

    stroke-width:2;
}


/* ============================================================
   LOADING TEXT
============================================================ */

.hint{
    margin-top:18px;

    text-align:center;

    color:rgba(220,225,255,.52);

    font-size:12px;

    font-weight:300;
}


/* ============================================================
   MOBILE
============================================================ */

@media(max-width:600px){

    .page{
        padding:25px 14px;
    }

    .story-card{
        padding:20px;

        border-radius:18px;
    }

    textarea{
        min-height:280px;
    }

    .actions{
        flex-direction:column-reverse;
    }

    .actions button{
        width:100%;
    }

}

</style>
</head>


<body>

<main class="page">

    <div class="overlay"></div>


    <section class="container">


        <!-- BACK -->

        <a
            href="index.html"
            class="back">

            ← Back to AI Tales

        </a>


        <!-- TITLE -->

        <h1 class="title">

            Paste a Story

        </h1>


        <p class="subtitle">

            Bring your story into the world of AI Tales.

        </p>


        <!-- STORY CARD -->

        <div class="story-card">


            <label
                class="label"
                for="storyInput">

                Your Story

            </label>


            <textarea
                id="storyInput"
                placeholder="Once upon a time...&#10;&#10;Paste your story here and let AI Tales transform it into an immersive narrated experience."
            ></textarea>


            <!-- ACTIONS -->

            <div class="actions">


                <button
                    type="button"
                    class="clear-btn"
                    id="clearBtn">

                    Clear

                </button>


                <button
                    type="button"
                    class="continue-btn"
                    id="continueBtn">


                    <span id="continueText">
                        Continue
                    </span>


                    <svg
                        id="continueIcon"
                        viewBox="0 0 24 24">

                        <path
                            d="M5 12h14M13 6l6 6-6 6"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                    </svg>


                </button>


            </div>


        </div>


        <p class="hint" id="statusText">

            Your story will be analyzed for characters, narration and dialogue.

        </p>


    </section>

</main>


<script>


/* ============================================================
   ELEMENTS
============================================================ */

const storyInput =
    document.getElementById("storyInput");

const clearBtn =
    document.getElementById("clearBtn");

const continueBtn =
    document.getElementById("continueBtn");

const continueText =
    document.getElementById("continueText");

const continueIcon =
    document.getElementById("continueIcon");

const statusText =
    document.getElementById("statusText");


/* ============================================================
   BACKEND URL
============================================================ */

const API_URL =
    "http://127.0.0.1:8000";


/* ============================================================
   CLEAR STORY
============================================================ */

clearBtn.addEventListener("click", () => {

    storyInput.value = "";

    statusText.textContent =
        "Your story will be analyzed for characters, narration and dialogue.";

    storyInput.focus();

});


/* ============================================================
   PROCESS STORY
============================================================ */

continueBtn.addEventListener(
    "click",
    async () => {


        /* ----------------------------------------------------
           GET STORY
        ---------------------------------------------------- */

        const story =
            storyInput.value.trim();


        /* ----------------------------------------------------
           VALIDATION
        ---------------------------------------------------- */

        if (!story) {

            alert(
                "Please paste a story first."
            );

            storyInput.focus();

            return;
        }


        /* ----------------------------------------------------
           LOADING STATE
        ---------------------------------------------------- */

        continueBtn.disabled = true;

        clearBtn.disabled = true;

        continueText.textContent =
            "Processing...";

        continueIcon.style.display =
            "none";

        statusText.textContent =
            "AI Tales is analyzing your story and creating the narration...";


        try {


            /* ------------------------------------------------
               SEND STORY TO FASTAPI
            ------------------------------------------------ */

            const response =
                await fetch(
                    `${API_URL}/process-story`,
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({
                            story:story
                        })
                    }
                );


            /* ------------------------------------------------
               READ RESPONSE
            ------------------------------------------------ */

            const data =
                await response.json();


            /* ------------------------------------------------
               HANDLE BACKEND ERROR
            ------------------------------------------------ */

            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "The backend could not process the story."
                );

            }


            /* ------------------------------------------------
               SAVE RESULT
            ------------------------------------------------ */

            localStorage.setItem(
                "aiTalesResult",
                JSON.stringify(data)
            );


            /* ------------------------------------------------
               SUCCESS
            ------------------------------------------------ */

            console.log(
                "AI Tales backend response:",
                data
            );


            statusText.textContent =
                "Your story has been transformed successfully!";


            /* ------------------------------------------------
               GO TO RESULT PAGE
            ------------------------------------------------ */

            window.location.href =
                "result.html";


        }


        /* ----------------------------------------------------
           CONNECTION / SERVER ERROR
        ---------------------------------------------------- */

        catch(error) {

            console.error(
                "AI Tales error:",
                error
            );


            let message =
                "Something went wrong while processing your story.";


            if (
                error instanceof TypeError
            ) {

                message =
                    "Could not connect to the AI Tales backend. " +
                    "Make sure FastAPI is running on port 8000.";

            }
            else if(error.message) {

                message =
                    error.message;

            }


            alert(message);


            statusText.textContent =
                "Unable to process the story. Please try again.";


            /* ------------------------------------------------
               RESTORE BUTTONS
            ------------------------------------------------ */

            continueBtn.disabled =
                false;

            clearBtn.disabled =
                false;

            continueText.textContent =
                "Continue";

            continueIcon.style.display =
                "block";

        }

    }
);

</script>

</body>

</html>
